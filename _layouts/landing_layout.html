---
layout: default
---
<div class="landing-container">
  <h1>{{ page.title }}</h1>
  
  <div class="landing-image{% if page.thumbnail %} has-art{% endif %}">
    {% if page.thumbnail %}
      <img src="{{ page.thumbnail | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}" width="1536" height="1024" fetchpriority="high">
    {% else %}
      {{ page.landing_emoji | default: "✨" }}
    {% endif %}
  </div>
  
  <div class="landing-desc content-area">
    {{ content }}
  </div>
  
  <!-- We assume the active test engine file is play.html relative to this dir -->
  <a href="{% if page.play_url %}{{ page.play_url | relative_url }}{% else %}play.html{% endif %}" class="btn btn-primary">테스트 시작하기</a>
</div>
